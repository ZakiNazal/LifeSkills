name: lifeskills
description: "LifeSkills, an exercise and wellness tracker."
publish_to: 'none'
version: 2.1.0+9

environment:
  sdk: ^3.4.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.4.1
  cloud_functions: ^6.3.1
  firebase_analytics: ^12.4.1
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_native_splash: ^2.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  package_info_plus: ^10.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2

flutter_native_splash:
  color: "#FAF9F7"
  image: asset/images/lifeskills.jpg
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/images/lifeskills.jpg
    - asset/images/myphoto.jpg
    - asset/images/google.png
    - asset/images/apple.png

  fonts:
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Light.ttf
          weight: 300
        - asset: fonts/Rubik-Regular.ttf
          weight: 400
        - asset: fonts/Rubik-Medium.ttf
          weight: 500
        - asset: fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: fonts/Rubik-Bold.ttf
          weight: 700
